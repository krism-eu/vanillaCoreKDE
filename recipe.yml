name: Vanilla Core KDE
id: vanilla-core-kde
vibversion: 1.1.0

stages:
  - id: build
    base: ghcr.io/vanilla-os/core:latest
    addincludes: true
    singlelayer: false
    labels:
      maintainer: krism-eu
      org.opencontainers.image.title: Vanilla Core KDE
      org.opencontainers.image.description: Minimal Vanilla OS Core image with KDE Plasma
      org.opencontainers.image.source: https://github.com/krism-eu/vanillaCoreKDE
    args:
      DEBIAN_FRONTEND: noninteractive

    runs:
      commands:
        - printf '%s\n' 'APT::Install-Recommends "0";' 'APT::Install-Suggests "0";' > /etc/apt/apt.conf.d/01norecommends

    # VIB 1.1.0 removes these after every generated RUN command. Keep APT
    # package indexes out of this list because later modules still need them.
    cleanup:
      - /var/cache/apt/archives/*.deb
      - /var/cache/debconf
      - /var/cache/ldconfig
      - /var/cache/man
      - /var/log/*
      - /root/.cache
      - /tmp/*
      - /var/tmp/*

    modules:
      - name: init-setup
        type: shell
        commands:
          - apt-get update

      - name: vanilla-tools
        type: shell
        sources:
          - type: tar
            url: https://github.com/Vanilla-OS/vanilla-tools/releases/download/v1.0.0/vanilla-tools.tar.gz
            checksum: 0e1d92d9c9154f9a115e97b40ff692afa52ddd0d9f770a8ec67440bf1a48aa72
        commands:
          - mkdir -p /usr/bin
          - LPKG_SRC="$(find /sources/vanilla-tools -type f -name lpkg -print -quit)" && test -n "$LPKG_SRC" && cp "$LPKG_SRC" /usr/bin/lpkg
          - CUR_GPU_SRC="$(find /sources/vanilla-tools -type f -name cur-gpu -print -quit)" && test -n "$CUR_GPU_SRC" && cp "$CUR_GPU_SRC" /usr/bin/cur-gpu
          - chmod +x /usr/bin/lpkg /usr/bin/cur-gpu

      - name: kde-desktop
        type: includes
        includes:
          - modules/10-kde-packages.yml
          - modules/15-hardware-prune.yml
          - modules/20-kde-setup.yml
          - modules/30-locale.yml

      - name: set-image-name-abroot
        type: includes
        includes:
          - modules/80-set-image-abroot-config.yml

      - name: cleanup
        type: shell
        commands:
          - apt-get autoremove --purge -y
          - apt-get clean
          - lpkg --lock
          - rm -rf /var/lib/apt/lists/*
