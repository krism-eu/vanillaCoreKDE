name: hardware-prune
type: shell
commands:
  # Vanilla Core ships a broad firmware set. Keep this image targeted to the
  # Ryzen/AMD + MediaTek laptop; required packages are explicitly marked manual
  # by modules/10-kde-packages.yml before this removal.
  - apt-get remove -y firmware-linux firmware-iwlwifi firmware-realtek firmware-atheros firmware-b43-installer firmware-brcm80211 firmware-sof-signed firmware-intel-graphics firmware-intel-misc firmware-nvidia-graphics intel-microcode
