name: install-kde-packages
type: apt
sources:
  - packages:
      # Keep the desktop set explicit: no kde-standard/kde-full metapackages.
      # Recommends are disabled globally, so functionality we want is listed here.
      - plasma-desktop
      - plasma-workspace
      - kwin-wayland
      - systemsettings
      - kscreen
      - sddm
      - sddm-theme-breeze
      - breeze-icon-theme
      - breeze-cursor-theme
      - plasma-nm
      - plasma-pa
      - powerdevil
      - bluedevil
      - dolphin
      - kio-extras
      - konsole
      - kate
      - okular
      - ark
      - gwenview
      - kcalc
      - flatpak
      - plasma-discover
      - plasma-discover-backend-flatpak
      - xdg-desktop-portal
      - xdg-desktop-portal-kde
      - network-manager
      - bluez
      - pipewire
      - pipewire-pulse
      - wireplumber
      - cups
      - udisks2
      - upower
      - xdg-user-dirs
      - xdg-utils
      - fonts-noto-core
      - fonts-noto-mono
      - fonts-noto-color-emoji
