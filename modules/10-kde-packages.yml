name: kde-packages
type: apt
sources:
  - packages:
      # Plasma 6 / Wayland. Debian Plasma 6 ships plasma.desktop in plasma-workspace.
      - plasma-desktop
      - plasma-workspace
      - kwin-wayland
      - systemsettings
      - kscreen
      - polkit-kde-agent-1
      - sddm
      - sddm-theme-breeze
      - breeze-icon-theme
      - breeze-cursor-theme
      - breeze-gtk-theme
      - layer-shell-qt
      - plasma-nm
      - plasma-pa
      - powerdevil
      - bluedevil
      - kio-extras
      - udisks2
      - upower
      - xdg-desktop-portal
      - xdg-desktop-portal-kde
      - xdg-user-dirs
      - xdg-utils

      # AMD graphics: OpenGL/DRI plus RADV Vulkan.
      - libgl1-mesa-dri
      - mesa-vulkan-drivers

      # Minimal X.Org rescue stack for the SDDM greeter only.
      - xserver-xorg-core
      - xserver-xorg-input-libinput
      - dbus-x11

      # Audio / network / Bluetooth / printing.
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - network-manager
      - bluez
      - cups

      # Hardware target: Ryzen 5 5600U / AMD Vega + MediaTek Wi-Fi/Bluetooth.
      - firmware-amd-graphics
      - firmware-mediatek
      - amd64-microcode

      # Minimal base font.
      - fonts-dejavu-core

      # Minimal applications.
      - dolphin
      - konsole
      - kate
      - okular
      - ark
      - kcalc
      - kde-spectacle
