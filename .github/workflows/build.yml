name: Build OCI image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: vanillacorekde

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Containerfile with VIB
        uses: vanilla-os/vib-gh-action@v1.1.0
        with:
          recipe: recipe.yml

      - name: Resolve image coordinates
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_URL=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          printf '%s' 'ghcr.io/vanilla-os/core:latest' > includes.container/image-info/base-image-name
          printf '%s/%s' "$owner" "$IMAGE_NAME" > includes.container/image-info/image-name

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_URL }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=main,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test pushed image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          image="${IMAGE_URL}@${{ steps.build.outputs.digest }}"
          expected_name="${IMAGE_URL#ghcr.io/}"
          docker pull "$image"
          docker run --rm \
            -e EXPECTED_NAME="$expected_name" \
            --entrypoint /bin/sh "$image" -c '
              set -eu

              for cmd in plasmashell grep lpkg; do
                command -v "$cmd" >/dev/null || {
                  echo "missing required runtime command: $cmd" >&2
                  exit 1
                }
              done

              test -x /usr/sbin/greetd
              test -x /usr/bin/tuigreet
              test -f /etc/greetd/config.toml
              grep -q "/usr/share/wayland-sessions" /etc/greetd/config.toml
              test -f /usr/share/wayland-sessions/plasma.desktop
              test -x /usr/bin/startplasma-wayland
              test -x /usr/bin/kwin_wayland
              test ! -e /usr/share/xsessions/plasmax11.desktop
              ! command -v sddm >/dev/null 2>&1
              ! dpkg-query -W -f="${Package} ${db:Status-Status}\n" 2>/dev/null | grep -E "^xserver-xorg[^ ]* installed$|^dbus-x11 installed$"
              grep -q "\"name\": \"$EXPECTED_NAME\"" /usr/share/abroot/abroot.json
              grep -q "^LANG=it_IT.UTF-8$" /etc/default/locale
            '

      - name: Attest image
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_URL }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false
